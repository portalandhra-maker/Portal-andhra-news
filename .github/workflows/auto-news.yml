name: Auto Scrape & Update News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Run news scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: python scraper.py

      - name: Commit & Push updated news.json
        run: |
          git config user.name "Portal Andhra Bot"
          git config user.email "bot@portalandhra.com"
          git add data/news.json
          git diff --staged --quiet || git commit -m "Auto-update scraped news"
          git push
