name: Portal Andhra - News Scraper

on:
  schedule:
    # Runs every 30 minutes, offset from the top of the hour to reduce scheduling delays.
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portal-andhra-news-scraper
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements_portal_andhra.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_portal_andhra.txt

      - name: Check required Gemini secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run Portal Andhra scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          USE_GEMINI: '1'
          DATA_FILE: data/news.json
          MAX_ITEMS: '100'
          MAX_PER_SOURCE: '20'
          MIN_ARTICLE_CHARS: '350'
          LOG_LEVEL: INFO
        run: python portal_andhra_scraper.py

      - name: Commit and push updated news
        run: |
          git config user.name "Portal Andhra Bot"
          git config user.email "bot@portalandhra.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Auto-update Portal Andhra news"
            git push origin "${GITHUB_REF_NAME}"
          fi
